sonar.projectKey=rebecalara_remote-software-deployer
sonar.organization=rebecalara
sonar.projectName=Remote Software Deployer
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Código analisado: backend (NestJS) e frontend (React).
# Fora: backend/prisma (schema e migrações SQL do PostgreSQL; o analisador de SQL do Sonar
# não é de PostgreSQL e só geraria ruído) e backend/scripts (*.ps1: sem analisador no Sonar).
sonar.sources=backend/src,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/src/deployments/testing/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,frontend/src/test/**

# Testes: contam como teste, nunca como código.
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,frontend/src/test/**
sonar.test.exclusions=**/node_modules/**,backend/src/deployments/testing/**

# Cobertura: os relatórios do Jest e do Vitest. As mesmas exclusões dos dois, para o número
# do Sonar bater com o dos relatórios (o Jest já não conta spec nem testing/).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/types/**,**/*.d.ts
